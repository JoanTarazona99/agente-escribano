[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agente-escribano-backend"
version = "0.1.0"
requires-python = ">=3.13"
description = "Agente de búsqueda y análisis de artículos sobre ЭМС"
dependencies = [
    "PyPDF2>=3.0.0",
]

# ─── pytest ───────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "slow: tests que tardan más de 2 segundos",
    "integration: tests que requieren servicios externos",
]

# ─── Coverage ─────────────────────────────────────────────
[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ─── Ruff (linting) ───────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["migrations", ".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN"]
ignore = [
    "ANN101",  # self no necesita anotación
    "ANN102",  # cls no necesita anotación
    "ANN401",  # Any permitido en algunos casos
]
